name: Deploy Modal App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "可选：指定 Modal App 名称。留空则默认为 vevc-app。部署不同名称可同时运行多个独立应用。"
        required: false
        default: "vevc-app"
      modal_secret_name:
        description: "可选：指定引用的 Modal Secret 名称。留空则默认为 custom-secret。多应用需要不同配置时可指定不同 Secret。"
        required: false
        default: "custom-secret"
      modal_region:
        description: "可选：指定 Modal 运行区域（例如 us-west、ap-northeast-1）。多个区域用英文逗号分隔。留空表示不固定区域（默认调度）。参考：https://modal.com/docs/guide/region-selection#region-options"
        required: false
        default: ""
      modal_nonpreemptible:
        description: "可选：启用非抢占（non-preemptible）。开启后可以固定IP，CPU/内存成本更高。参考：https://modal.com/docs/guide/preemption#non-preemptible-functions"
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal CLI
        run: |
          python -m pip install --upgrade pip
          pip install modal==1.4.1

      - name: Deploy with Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_APP_NAME: ${{ inputs.app_name }}
          MODAL_SECRET_NAME: ${{ inputs.modal_secret_name }}
          MODAL_REGION: ${{ inputs.modal_region }}
          MODAL_NONPREEMPTIBLE: ${{ inputs.modal_nonpreemptible }}
        run: |
          set -euo pipefail
          modal deploy --name "${MODAL_APP_NAME:-vevc-app}" main.py
